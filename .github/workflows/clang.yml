name: Clang

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: Context
    uses: ./.github/workflows/context.yml

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clang format
        uses: cpp-linter/cpp-linter-action@774040af57f011a5fc47911f08ff0c3059d1835a # v2.24.0
        id: format
        with:
          files-changed-only: false
          step-summary: true
          style: file
          tidy-checks: -*

      - name: Summary
        run: |
          echo "Clang report:"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }}"
          else
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit $(( ${{ steps.format.outputs.clang-format-checks-failed }} != 0 ))

  tidy:
    name: Tidy
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.11
          version: latest-known

      - name: PlatformIO compilation database
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > firmware/include/config/secrets.h
          #pragma once
          #define PIN_BUZ 1
          #define PIN_CDS 2
          #define PIN_CLK1 3
          #define PIN_CLK2 4
          #define PIN_CLK3 5
          #define PIN_DA1 6
          #define PIN_DA2 7
          #define PIN_DA3 8
          #define PIN_EN 9
          #define PIN_PDM 10
          #define PIN_WAKE 11
          #define PIN_REAR 26
          #define PIN_TOP 27
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          EOL
          uv run --only-group platformio pio run -t compiledb -e "$PIO_ENVIRONMENT"

      - name: Clang tidy
        uses: cpp-linter/cpp-linter-action@774040af57f011a5fc47911f08ff0c3059d1835a # v2.24.0
        id: tidy
        with:
          file-annotations: false
          files-changed-only: false
          step-summary: true
          style: ""
          tidy-checks: ""

      - name: Summary
        env:
          clang-threshold: 171
        run: |
          echo "Status: ${{ steps.tidy.outputs.checks-failed }} checks failed, threshold for success is ${{ env.clang-threshold }}."
          echo "Clang report:"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }}"
          else
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit $(( ${{ steps.tidy.outputs.checks-failed }} > ${{ env.clang-threshold }} ))
