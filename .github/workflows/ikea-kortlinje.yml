name: IKEA Kortlinje

on:
  merge_group:
    types:
      - checks_requested

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: Context
    uses: ./.github/workflows/context.yml

  full:
    name: Full
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.11
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > .env
          HOSTNAME='kortlinje'
          NAME='Kortlinje'
          OTA_KEY='redacted'
          TEMPERATURE_UNIT='K'
          TIME_ZONE='Etc/Universal'
          EOL
          cat <<'EOL' > firmware/include/config/secrets.h
          #pragma once
          #define PIN_BUZ 1
          #define PIN_CDS 2
          #define PIN_CLK1 3
          #define PIN_CLK2 4
          #define PIN_CLK3 5
          #define PIN_DA1 6
          #define PIN_DA2 7
          #define PIN_DA3 8
          #define PIN_EN 9
          #define PIN_PDM 10
          #define PIN_WAKE 11
          #define PIN_REAR 26
          #define PIN_TOP 27
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          EOL
          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"

  minimal:
    name: Minimal
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.11
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > firmware/include/config/secrets.h
          #pragma once
          #define PIN_BUZ 1
          #define PIN_CDS 2
          #define PIN_CLK1 3
          #define PIN_CLK2 4
          #define PIN_CLK3 5
          #define PIN_DA1 6
          #define PIN_DA2 7
          #define PIN_DA3 8
          #define PIN_EN 9
          #define PIN_PDM 10
          #define PIN_WAKE 11
          #define PIN_REAR 26
          #define PIN_TOP 27
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          EOL
          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"
