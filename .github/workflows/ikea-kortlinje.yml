name: IKEA Kortlinje

on:
  merge_group:
    types:
      - checks_requested

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: Context
    uses: ./.github/workflows/context.yml

  full:
    name: Full
    needs: context
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: 3.13
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > secrets.toml
          [device]
          hostname = 'kortlinje'
          name = 'Kortlinje'
          temperature_unit = 'K'
          [mqtt]
          host = '127.0.0.1'
          password = 'redacted'
          username = 'redacted'
          [ota]
          password = 'redacted'
          [pin]
          audio_buzzer = 1
          button_rear = 26
          button_top = 27
          climate_en = 2
          climate_pdm = 3
          display_sclk1 = 4
          display_sclk2 = 5
          display_sclk3 = 6
          display_sda1 = 7
          display_sda2 = 8
          display_sda3 = 9
          light_sense = 10
          power_sense = 11
          [time]
          format = 24
          posix = 'UTC0'
          zone = 'Etc/UTC'
          [weather]
          latitude = 0.000
          longitude = 0.000
          [wifi]
          psk = 'redacted'
          ssid = 'redacted'
          EOL
          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"

  minimal:
    name: Minimal
    needs: context
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: 3.13
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > secrets.toml
          [pin]
          audio_buzzer = 1
          button_rear = 26
          button_top = 27
          climate_en = 2
          climate_pdm = 3
          display_sclk1 = 4
          display_sclk2 = 5
          display_sclk3 = 6
          display_sda1 = 7
          display_sda2 = 8
          display_sda3 = 9
          light_sense = 10
          power_sense = 11
          [wifi]
          psk = 'redacted'
          ssid = 'redacted'
          EOL
          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"
