name: Cpplint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: cpplint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: 3.13
          version: latest-known

      - name: cpplint
        run: uv run --only-group cpplint cpplint \
          --counting=detailed \
          --filter=+,-build/include_alpha,-build/include_order,-legal/copyright,-readability/braces,-readability/fn_size,-runtime/int,-runtime/references,-whitespace/braces,-whitespace/comments,-whitespace/indent,-whitespace/line_length,-whitespace/newline \
          --quiet \
          --recursive \
          --verbose=0 \
          .
