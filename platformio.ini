[platformio]
name = Kortlinje
description = RP2350 mod for IKEA Kortlinje alarm clock
core_dir = .platformio
include_dir = firmware/include
src_dir = firmware/src

[env]
platform = https://api.github.com/repos/maxgerhardt/platform-raspberrypi/tarball/5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
lib_deps =
	ayushsharma82/RPAsyncTCP @ 1.3.2
	bblanchon/ArduinoJson @ 7.4.3
	esp32async/ESPAsyncWebServer @ 3.11.2
extra_scripts =	pre:scripts/extra_script.py
monitor_speed = 115200
monitor_filters =
	log2file
	time
build_flags =
	-std=gnu++26
;	-DRP2350_ERRATA_E9
build_unflags = -std=gnu++17
;upload_protocol = espota
;upload_port = kortlinje.local

[env:rpipico2w]
board = rpipico2w
board_build.filesystem_size = 2m
