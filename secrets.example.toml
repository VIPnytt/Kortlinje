#
# Build configuration for the Kortlinje project
# https://github.com/VIPnytt/Kortlinje/wiki
#
# Copy this file to `secrets.toml` and adjust it to your build. The copy is
# ignored by Git, so credentials stay local. Every setting is optional, and
# the values below are the defaults used when it is left out.
#

[device]
name = 'Kortlinje'
hostname = 'kortlinje'  # .local
temperature_unit = '°C'

[ota]
# password = 'password'

[pin]
audio_buzzer = 1
button_top = 26
button_rear = 27
climate_pdm = 2
climate_en = 3
co2_scl = 13  # optional SCD4x, disabled when left out
co2_sda = 12  # optional SCD4x, disabled when left out
display_sclk1 = 4
display_sclk2 = 5
display_sclk3 = 6
display_sda1 = 7
display_sda2 = 8
display_sda3 = 9
light_sense = 10
power_sense = 11

[mqtt]
# host = 'mqtt.local'
# username = 'username'
# password = 'password'

[weather]
latitude = 0.000
longitude = 0.000

[wifi]
# Optional, the clock starts a hotspot for Wi-Fi setup when no network is saved.
# ssid = 'name'
# psk = 'password'
