#
# Environment variables for the Kortlinje project
# https://github.com/VIPnytt/Kortlinje/wiki
#

[device]
name = 'Kortlinje'
hostname = 'kortlinje'  # .local
temperature_unit = '°C'

[ota]
# password = 'password'

[pin]
audio_buzzer = 1
button_top = 26
button_rear = 27
climate_pdm = 2
climate_en = 3
co2_scl = 13  # optional, SCD4x
co2_sda = 12  # optional, SCD4x
display_sclk1 = 4
display_sclk2 = 5
display_sclk3 = 6
display_sda1 = 7
display_sda2 = 8
display_sda3 = 9
light_sense = 10
power_sense = 11

[mqtt]
# host = 'mqtt.local'
# username = 'username'
# password = 'password'

[weather]
latitude = 0.000
longitude = 0.000

[wifi]
ssid = 'name'
psk = 'password'
